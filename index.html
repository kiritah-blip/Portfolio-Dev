<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Jules Balluais</title>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.3.2/build/spline-viewer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@1&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Cinzel', serif; }

        /* La 3D en fond */
        #spline-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Voile sombre pour faire ressortir le texte */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.7) 100%);
            z-index: 1;
            pointer-events: none; /* Laisse passer le clic vers les cubes */
        }

        /* Contenu textuel */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
        }

        h1 { font-size: 5rem; letter-spacing: 15px; margin: 0; text-transform: uppercase; opacity: 0; animation: fadeInUp 1.5s forwards; }
        .name { font-family: 'Lora', serif; font-style: italic; font-size: 2rem; margin: 20px 0; opacity: 0; animation: fadeInUp 1.5s 0.5s forwards; }
        .name span { color: #d4af37; } /* Le doré pour le J et B */
        
        .btn-discover {
            margin-top: 50px;
            padding: 15px 30px;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            color: #d4af37;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
            opacity: 0;
            animation: fadeIn 2s 1.5s forwards;
        }

        .btn-discover:hover { background: rgba(212, 175, 55, 0.1); border-color: #d4af37; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="spline-bg">
        <spline-viewer url="https://prod.spline.design/11LdDp4sO0B0h84t/scene.splinecode"></spline-viewer>
    </div>

    <div class="overlay"></div>

    <div class="content">
        <p style="letter-spacing: 5px; font-size: 0.8rem; color: rgba(255,255,255,0.5);">2024 — 2026</p>
        <h1>Portfolio</h1>
        <div class="name"><span>J</span>ules <span>B</span>alluais</div>
        <div style="width: 100px; height: 1px; background: #d4af37; margin: 20px 0;"></div>
        <p style="font-size: 0.7rem; letter-spacing: 3px; color: rgba(255,255,255,0.6);">BUT MESURES PHYSIQUES · IUT DE BLOIS</p>
        
        <button class="btn-discover" onclick="enterSite()">CLIQUER POUR DÉCOUVRIR ↓</button>
    </div>

    <script>
        function enterSite() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 1s';
            setTimeout(() => {
                // Ici tu mettras le lien vers ton vrai portfolio
                window.location.href = "page-accueil.html"; 
            }, 1000);
        }
    </script>
</body>
</html>
